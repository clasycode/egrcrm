{% extends 'crm/base.html' %}{% load ui %}{% block content %}<div class="page-heading"><div><p class="eyebrow">{{ ui_page_label }}</p><h1>{{ title }}</h1><p>{{ description|default:'Изменения сохраняются в постоянной базе CRM.' }}</p></div></div><section class="panel form-card"><form method="post">{% csrf_token %}{{ form.as_p }}<hr><div class="toolbar"><button>Сохранить {% ui_icon 'check' %}</button><a class="button button--ghost" href="{% if back_url %}{{ back_url }}{% elif request.path|slice:':7' == '/tasks/' %}/tasks/{% else %}/{% endif %}">Вернуться</a></div></form></section>{% endblock %}
