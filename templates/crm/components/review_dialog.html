{% load ui %}<dialog id="review-dialog" data-has-errors="{{ review_form.errors|yesno:'true,false' }}"><div class="dialog-head"><div><h2>Завершить обработку</h2><p data-review-name>{{ row.name }}</p></div><button class="button--text icon-button" data-dialog-close aria-label="Закрыть итог обработки">{% ui_icon 'close' %}</button></div><form method="post" action="/work/complete/">{% csrf_token %}<input type="hidden" name="next" value="{% if request.GET.work or request.path == '/work/complete/' %}/work/{% else %}{{ request.get_full_path }}{% endif %}"><div class="dialog-body"><p class="small muted">Запишите, что выяснили и что сделаете дальше. Одна компания учитывается в вашем плане один раз. CRM-статус, задачи и обращения ведутся отдельно.</p>{{ review_form.as_p }}</div><div class="dialog-footer"><button type="button" class="button--ghost" data-dialog-close>Отмена</button><button>{% ui_icon 'check' %} Сохранить итог</button></div></form></dialog>
