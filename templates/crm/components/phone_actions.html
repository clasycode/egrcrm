{% load ui %}{% if number or with_search %}<div class="contact-quick-actions" aria-label="Быстрые действия с контактами">{% if number %}<a class="quick-action" href="https://t.me/{{ number }}" target="_blank" rel="noopener noreferrer" data-external-action="phone:{{ company.pk }}:{{ contact.pk }}:telegram:{{ number }}" aria-label="Открыть {{ number }} в Telegram" title="Открыть {{ number }} в Telegram">{% ui_icon 'telegram' %}<span class="sr-only">Telegram</span></a><a class="quick-action" href="viber://chat?number=%2B{{ number|slice:'1:' }}" data-external-action="phone:{{ company.pk }}:{{ contact.pk }}:viber:{{ number }}" aria-label="Открыть {{ number }} в Viber" title="Открыть {{ number }} в Viber">{% ui_icon 'viber' %}<span class="sr-only">Viber</span></a>{% endif %}{% if with_search %}{% company_search company True %}{% endif %}</div>{% endif %}
